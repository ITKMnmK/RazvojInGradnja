name: Build Test Push and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FeriDockerCI.Tests/FeriDockerCI.Tests.csproj

      - name: Build application
        run: dotnet build FeriDockerCI.csproj --configuration Release

      - name: Run unit tests with code coverage
        run: dotnet test FeriDockerCI.Tests/FeriDockerCI.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --verbosity normal

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;MarkdownSummaryGithub'

      - name: Publish coverage summary
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: CodeCoverageReport
          path: coveragereport

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            miloradknezevic/feridockerci:latest
            miloradknezevic/feridockerci:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vaja2
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: miloradknezevic/feridockerci:latest
